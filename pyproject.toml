[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-trust-service-mesh"
version = "0.1.0"
description = "Workload identity for a service mesh: SPIRE-issued SPIFFE identities and Envoy mutual TLS, generated from one spec and checked locally and in a kind cluster."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["cryptography>=46,<51"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.6", "mypy>=1.11", "pip-audit>=2.7"]

[project.scripts]
ztmesh = "zero_trust_service_mesh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120

[tool.ruff]
line-length = 100
extend-exclude = [".tmp", ".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "N", "C4", "PT", "RET", "PIE", "PERF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108"]

[tool.mypy]
strict = true
files = ["src", "tests"]
